name: Place-learning forecast (machine learning)

# Trains the AtmosDays "forecast that learns your place": gradient-boosted trees
# that learn how the GFS-family forecast misses at US airport stations, from
# NOAA's free archives (GEFS reforecast 2000-2019, GFS 2021 on, hourly station
# records). See ml/README.md.
#
# Training data is kept as assets of the "ml-data" release in this repo (all of
# it public NOAA data: no customer places). Each run picks up where the last
# stopped, adds the newest days, retrains and sends the model to the website.
# This repo is public, so GitHub doesn't count the minutes.
#
# Only the schedule and the owner's "Run workflow" button start it.
on:
  schedule:
    # Daily: while the history is being collected, each run adds a few years;
    # after that a run just adds new days (weekly) and retrains.
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      train_only:
        description: 'Skip collecting data; just retrain'
        type: boolean
        default: false

permissions:
  contents: write  # upload training data to the ml-data release

concurrency:
  group: place-forecast-ml
  cancel-in-progress: false

jobs:
  learn:
    if: github.repository == 'eagleeyeinsights/atmosdays-model-maps'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt
      - name: Get the training data so far
        run: |
          gh release view ml-data -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create ml-data -R "$GITHUB_REPOSITORY" --title "Place-learning forecast training data" \
              --notes "Old forecasts paired with what US airport stations measured, from NOAA's free archives. Built by the place-forecast-ml workflow; see ml/README.md."
          mkdir -p data
          gh release download ml-data -R "$GITHUB_REPOSITORY" -D data --clobber || true
          ls -la data
      - name: Collect more days
        if: ${{ !inputs.train_only }}
        run: python -m ml.run build --data data --max-minutes 240 --release ml-data
      - name: Train, test on held-back years, send to the website
        env:
          MODELS_UPLOAD_KEY: ${{ secrets.MODELS_UPLOAD_KEY }}
          MODELS_SITE: ${{ vars.MODELS_SITE }}
        run: |
          mkdir -p model
          python -m ml.run train --data data --out model/local-v1.json --upload
      - name: Live scoreboard (save today's GFS, AI-corrected and ECMWF AI forecasts; score past days)
        env:
          MODELS_UPLOAD_KEY: ${{ secrets.MODELS_UPLOAD_KEY }}
          MODELS_SITE: ${{ vars.MODELS_SITE }}
        run: |
          python -m ml.run live --data data --model model/local-v1.json --release ml-data --upload
          gh release upload ml-data model/local-v1-report.json --clobber -R "$GITHUB_REPOSITORY"
