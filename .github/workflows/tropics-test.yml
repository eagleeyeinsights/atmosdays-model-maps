name: Tropics test (temporary)
on:
  push:
    branches: [claude/project-thread-qjxsnc]
    paths: [tropics.py, .github/workflows/tropics-test.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tropics.py --test --recon-sample 8 --out out/tropics.json
      - run: python -c "import json;d=json.load(open('out/tropics.json'));r=d['recon'];[x.pop('raw') for x in r['fixes']];print(json.dumps(r['fixes'],indent=0)[:4000]);f=r['flights'];print(json.dumps([(x['aircraft'],x['mission'],x['storm'],[(o['time'],o['pts'][:2]) for o in x['obs']]) for x in f]) if f else 'no flights')"
      - run: gzip -9c out/tropics.json | base64 -w 0; echo
