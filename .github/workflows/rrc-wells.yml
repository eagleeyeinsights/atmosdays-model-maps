name: Texas well index (Railroad Commission)

# Builds the Texas well index for AtmosDays Well Sites from two free public
# Railroad Commission of Texas downloads (Well Layers by County and Statewide
# API Data) and uploads one small file per county to the website. The RRC
# refreshes these files about twice a week; a daily run keeps up.
# See wells/rrc_wells.py. This repo is public, so GitHub doesn't count minutes.
# Needs the MODELS_UPLOAD_KEY secret (the same one the model maps use).
#
# Only the schedule and the owner's "Run workflow" button start this job.
on:
  schedule:
    # Twice a day. The RRC file site turns some GitHub computers away every time and
    # lets others in, so each run tries up to 6 computers in turn (see the wells job).
    # A run does nothing once the day's index is built.
    - cron: '35 9 * * *'    # 3:35 or 4:35 AM Central, after the RRC's evening refresh
    - cron: '35 21 * * *'
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Test: build 5 counties and keep them as a download, upload nothing'
        type: boolean
        default: false
      diagnose:
        description: 'Check only: can 4 GitHub computers reach the RRC file site? Builds and uploads nothing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rrc-wells
  cancel-in-progress: false

jobs:
  diagnose:
    # One read-only look at the RRC file site from 4 GitHub computers at once,
    # to see whether some of GitHub's addresses are turned away and others aren't.
    if: github.repository == 'eagleeyeinsights/atmosdays-model-maps' && inputs.diagnose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        computer: [1, 2, 3, 4]
    steps:
      - name: This computer's internet address
        run: curl -s --max-time 10 https://api.ipify.org || echo unknown
      - name: Connect to the RRC well layer folder (curl)
        run: |
          for i in 1 2 3; do
            curl -sS -v -L --max-time 20 -o /dev/null -w 'HTTP %{http_code} in %{time_total}s\n' \
              'https://mft.rrc.texas.gov/link/d551fb20-442e-4b67-84fa-ac3f23ecabb4' 2>&1 \
              | grep -E '^(\* (Trying|Connected|SSL|TLS|ALPN|OpenSSL|Recv failure|Connection)|HTTP |curl:)|^< HTTP' || true
            sleep 5
          done
      - name: TLS handshake (openssl)
        run: echo | timeout 20 openssl s_client -connect mft.rrc.texas.gov:443 -servername mft.rrc.texas.gov -brief 2>&1 | head -15 || true

  wells:
    # The RRC file site hangs up on some GitHub computers right after the secure
    # greeting, every time, and lets others in (checked 2026-11-22: 2 of 4). So the
    # job runs on up to 6 computers, one after another. A computer that's turned
    # away stops within seconds and the next one tries; once one has built the
    # index, the rest see it's fresh and do nothing. A real failure stops the rest.
    # Red only for a real failure, or an RRC outage with a website index over 4 days old.
    if: github.repository == 'eagleeyeinsights/atmosdays-model-maps' && !inputs.diagnose
    name: wells (computer ${{ matrix.computer }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        computer: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check the well index code
        run: python -m unittest wells/test_rrc_wells.py
      - name: Build and upload
        if: ${{ !inputs.test_only }}
        env:
          MODELS_UPLOAD_KEY: ${{ secrets.MODELS_UPLOAD_KEY }}
          MODELS_SITE: https://atmosdays.eagleeyeinsightsllc.com
          # Scheduled runs skip once today's index is built; computers 2-6 of a
          # manual run skip once an earlier computer has built it.
          SKIP: ${{ github.event_name == 'schedule' && '--skip-if-fresh 20' || (matrix.computer > 1 && '--skip-if-fresh 3' || '') }}
        run: python wells/rrc_wells.py --upload --computer ${{ matrix.computer }}/6 $SKIP
      - name: Test build (Anderson, Karnes, Loving, Reeves, Zavala; nothing uploaded)
        if: ${{ inputs.test_only }}
        run: python wells/rrc_wells.py --out out --counties 001,255,301,389,507 --computer ${{ matrix.computer }}/6
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.test_only && hashFiles('out/**') != '' }}
        with:
          name: wells-test-computer-${{ matrix.computer }}
          path: out
          retention-days: 3
